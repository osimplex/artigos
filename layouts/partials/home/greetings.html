{{- if site.Params.rtwt.home.showBio -}}
  <div class="centered-container">
    {{- if site.Params.rtwt.home.showAuthorImg -}}
      <img style="border: var(--dim-color) 2px solid;border-radius:32%;" width="360px" src="{{- hugo.Data.rtwt.content.home.image | default "images/perfil.jpg" -}}"/>
    {{- end -}}

    <h1 class="margin-sm">{{- hugo.Data.rtwt.content.home.greetings -}}</h1>
    <div class="dim" style="width:70%;margin:0 15%;">{{- hugo.Data.rtwt.content.home.text -}}
    </div>
  </div>
{{- end -}}
